events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # Attempt 1: strip the /ide/spike/ prefix (trailing slash on proxy_pass).
        # code-server then serves from its root but uses relative asset URLs, so the
        # browser resolves them back under /ide/spike/. This is the config from
        # code-server's own reverse-proxy docs. If the workbench assets 404, we flip
        # to the no-strip variant (see README) — that's what the spike decides.
        location /ide/spike/ {
            proxy_pass http://code-server:8080/;
            proxy_http_version 1.1;
            # $http_host (not $host) keeps the client port (:8099) so code-server's
            # absolute redirects don't drop it and loop. This was the actual bug.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Accept-Encoding gzip;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Convenience: redirect /ide/spike (no slash) to the slashed form.
        location = /ide/spike {
            return 302 /ide/spike/;
        }
    }
}
