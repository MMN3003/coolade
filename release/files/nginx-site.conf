# Host nginx site for Coolade Gateway.
# Copy to /etc/nginx/sites-available/coolade.conf, replace ai.example.com and the
# certificate paths, then symlink into sites-enabled and reload nginx.

# Needed once per nginx instance (http context). Skip if already defined.
map $http_upgrade $coolade_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream coolade_web {
    server 127.0.0.1:8085;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.example.com;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot); harmless otherwise.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.example.com;

    ssl_certificate     /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:coolade_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Attachments up to 60 MB (must match the app's own limit).
    client_max_body_size 60m;

    access_log /var/log/nginx/coolade.access.log;
    error_log  /var/log/nginx/coolade.error.log;

    location / {
        proxy_pass http://coolade_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $coolade_connection_upgrade;

        # Chat replies and Claude Code requests stream (SSE) and can run for minutes.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
