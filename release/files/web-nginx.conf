worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # SSE/streaming responses must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    client_max_body_size 60m;

    # Docker embedded DNS — lets us resolve service names at request time so a
    # `server` block referencing an optional service (code-server, ide profile)
    # doesn't stop nginx from starting when that service is absent.

    upstream backend_upstream {
        server backend:8000;
    }

    # WebSocket upgrade map (code-server needs Connection: upgrade only on WS).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Behind a TLS-terminating CDN/proxy the real client scheme arrives in
    # X-Forwarded-Proto; honor it so code-server builds wss:// (not ws://) URLs —
    # otherwise the browser blocks the extension-host socket as mixed content and the
    # in-IDE AI silently fails while the editor still loads.
    map $http_x_forwarded_proto $fwd_proto {
        default $scheme;
        https   https;
        http    http;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # v2 — raw relay for the CLI path: developers run Claude Code on their OWN
        # machine with ANTHROPIC_BASE_URL=https://<host>/relay + a personal key. Plain
        # streaming HTTPS (no websockets/CSP) so it works cleanly behind any CDN.
        location /relay/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header Connection "";
            proxy_buffering off;                 # stream SSE through unbuffered
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # amendment-1 — MCP gateway to organizational services (docs/SERVICES-V2.md ب-۳).
        # Same key-based auth as /relay; needed here only for the dev-CLI path —
        # workspace containers reach backend:8000 directly on the sandbox network.
        location /mcp/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        root /usr/share/nginx/html;
        index index.html;

        # Hashed build assets can be cached forever; index.html must not be.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }

}
