worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # SSE/streaming responses must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    client_max_body_size 25m;

    # Docker embedded DNS — lets us resolve service names at request time so a
    # `server` block referencing an optional service (code-server, ide profile)
    # doesn't stop nginx from starting when that service is absent.
    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream backend_upstream {
        server backend:8000;
    }

    # WebSocket upgrade map (code-server needs Connection: upgrade only on WS).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Behind a TLS-terminating CDN/proxy the real client scheme arrives in
    # X-Forwarded-Proto; honor it so code-server builds wss:// (not ws://) URLs —
    # otherwise the browser blocks the extension-host socket as mixed content and the
    # in-IDE AI silently fails while the editor still loads.
    map $http_x_forwarded_proto $fwd_proto {
        default $scheme;
        https   https;
        http    http;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # v2 — raw relay for the CLI path: developers run Claude Code on their OWN
        # machine with ANTHROPIC_BASE_URL=https://<host>/relay + a personal key. Plain
        # streaming HTTPS (no websockets/CSP) so it works cleanly behind any CDN.
        location /relay/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header Connection "";
            proxy_buffering off;                 # stream SSE through unbuffered
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # v2 — gated per-workspace IDE (TECH-V2 §3). auth_request asks the backend
        # whether this session owns workspace <id> and is running; on 200 the backend
        # returns the target container in X-Ecocode-Upstream. code-server needs
        # Host WITH port ($http_host) or its absolute redirects loop (spike §3.10).
        location ~ ^/ide/(?<wsid>\d+)/(?<rest>.*)$ {
            auth_request /_ide_authz;
            auth_request_set $ws_upstream $upstream_http_x_ecocode_upstream;
            proxy_pass http://$ws_upstream/$rest$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /_ide_authz {
            internal;
            proxy_pass http://backend_upstream/internal/authz/workspace/$wsid;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
        }

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # اصلاحیهٔ ۶ / amendment 6 — code-server (real VS Code) on a dedicated port.
    # code-server runs on the INTERNAL sandbox network (its terminal has no direct
    # internet — only the egress allowlist), and nginx (attached to both networks)
    # bridges the browser to it here. Auth is code-server's own PASSWORD for now;
    # per-user instances + EcoCode session gating are the next step. Served at ROOT
    # of this port to avoid code-server sub-path asset issues.
    server {
        listen 8090;
        server_name _;

        location / {
            set $code_server "code-server:8080";
            proxy_pass http://$code_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # --- TLS (optional, commented until an organizational/self-signed cert is
    #     mounted at ./certs — see README). Uncomment and mount ./certs:/etc/nginx/certs:ro
    #     to serve HTTPS on 443 in addition to the plain-HTTP 80 above.
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     location /api/ { proxy_pass http://backend_upstream; proxy_http_version 1.1; proxy_buffering off; }
    #     location /v1/  { proxy_pass http://backend_upstream; proxy_http_version 1.1; proxy_buffering off; }
    #     root /usr/share/nginx/html;
    #     index index.html;
    #     location / { try_files $uri $uri/ /index.html; }
    # }
}
