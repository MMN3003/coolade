worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # SSE/streaming responses must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    client_max_body_size 25m;

    upstream backend_upstream {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        location /v1/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # --- TLS (optional, commented until an organizational/self-signed cert is
    #     mounted at ./certs — see README). Uncomment and mount ./certs:/etc/nginx/certs:ro
    #     to serve HTTPS on 443 in addition to the plain-HTTP 80 above.
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     location /api/ { proxy_pass http://backend_upstream; proxy_http_version 1.1; proxy_buffering off; }
    #     location /v1/  { proxy_pass http://backend_upstream; proxy_http_version 1.1; proxy_buffering off; }
    #     root /usr/share/nginx/html;
    #     index index.html;
    #     location / { try_files $uri $uri/ /index.html; }
    # }
}
