name: ecocode

networks:
  ecocode_net:
    driver: bridge
  # اصلاحیهٔ ۶ / amendment 6 — Stage 2: internal-only network for sandbox containers.
  # `internal: true` = NO direct route to the internet; the sandbox's only egress is
  # the `egress` allowlist proxy (which is attached to BOTH this net and ecocode_net).
  ecocode_sandbox_net:
    name: ecocode_sandbox_net
    internal: true

volumes:
  postgres_data:
  users_data:
  teams_data:
  attachments_data:
  frontend_static:
  codeserver_config:
  # Claude Code CLI state (sessions/history) inside the backend container's HOME.
  # Must survive container recreation or --resume breaks for existing conversations;
  # .credentials.json inside it is (re)written by the backend's host->container sync
  # at startup and every 60s, so persisting it is safe.
  claude_state:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/01-init-multi-db.sh:ro
    expose:
      - "5432"
    networks: [ecocode_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # اصلاحیهٔ ۵ / amendment 5: LiteLLM removed. Both surfaces (web chat + /v1/* API)
  # now run through the Claude Code CLI inside the backend container.
  #
  # Optional token-compression proxy (opt-in): a small proxy that sits between the
  # CLI and the real upstream, compressing prompts to cut token usage while staying
  # on the same subscription (e.g. tamp / LLMLingua). It is NOT enabled by default —
  # it needs real-traffic tuning and cannot be validated against the mock upstream.
  # To enable: `docker compose --profile compression up`, then set
  # UPSTREAM_BASE_URL=http://compression:8788 in .env so the CLI routes through it.
  compression:
    build:
      context: ./compression
      network: host
    environment:
      UPSTREAM_TARGET: ${UPSTREAM_BASE_URL:-https://api.anthropic.com}
    expose:
      - "8788"
    networks: [ecocode_net]
    profiles: ["compression"]

  # اصلاحیهٔ ۶ / amendment 6 — Stage 2: egress allowlist proxy. The ONLY route to the
  # internet for sandbox containers. Enable with the `sandbox` profile. ALLOW_HOSTS is
  # the exact set of hosts the sandbox may reach (upstream API + org GitLab); a leading
  # dot allows subdomains. Attached to both networks so it can bridge internal→internet.
  egress:
    build:
      context: ./egress
      network: host
    environment:
      ALLOW_HOSTS: ${SANDBOX_ALLOW_HOSTS:-api.anthropic.com,git.ecobin.ir,.vscode-cdn.net,open-vsx.org,.open-vsx.org}
    networks: [ecocode_sandbox_net, ecocode_net]
    profiles: ["sandbox", "ide"]

  # اصلاحیهٔ ۶ / amendment 6 — code-server (real VS Code in the browser). Runs on the
  # INTERNAL sandbox network so its integrated terminal has NO direct internet (only the
  # egress allowlist); NO backend creds/DB are mounted. nginx bridges the browser to it
  # on port 8090. Auth = code-server PASSWORD (per-user instances + session gating next).
  code-server:
    image: codercom/code-server:latest
    command: ["--bind-addr", "0.0.0.0:8080", "--disable-telemetry", "--disable-update-check", "/data/users"]
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-ecocode-ide}
      HTTPS_PROXY: http://egress:8080
      HTTP_PROXY: http://egress:8080
      NO_PROXY: localhost,127.0.0.1
    # Runs as the image's coder user (uid 1000), matching users_data ownership.
    # (no-new-privileges is omitted: code-server's fixuid entrypoint needs it off.
    # Isolation still holds: internal-only network + egress allowlist, no creds/DB.)
    volumes:
      - users_data:/data/users
    networks: [ecocode_sandbox_net]
    mem_limit: 2g
    pids_limit: 512
    profiles: ["ide"]

  backend:
    build:
      context: ./backend
      network: host
    environment:
      ECOCODE_ENV: ${ECOCODE_ENV}
      UPSTREAM_MODE: ${UPSTREAM_MODE}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL}
      UPSTREAM_OAUTH_TOKEN_URL: ${UPSTREAM_OAUTH_TOKEN_URL}
      UPSTREAM_OAUTH_CLIENT_ID: ${UPSTREAM_OAUTH_CLIENT_ID}
      CLAUDE_CREDS_DIR: /host_claude
      CLI_MAX_CONCURRENCY: ${CLI_MAX_CONCURRENCY}
      CLI_TIMEOUT_SECONDS: ${CLI_TIMEOUT_SECONDS}
      MOCK_CLI: ${MOCK_CLI}
      THINKING_MAX_LEVEL: ${THINKING_MAX_LEVEL}
      # اصلاحیهٔ ۶ / amendment 6 — Stage 2 sandbox (OFF by default)
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-0}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ecocode-runner:latest}
      EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-http://egress:8080}
      GIT_REMOTE_BASE: ${GIT_REMOTE_BASE:-}
      MOCK_UPSTREAM_BASE: ${MOCK_UPSTREAM_BASE}
      ECOCODE_SECRET_KEY: ${ECOCODE_SECRET_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ECOCODE_DATABASE_URL: ${ECOCODE_DATABASE_URL}
      # LITELLM_MASTER_KEY is retained only as the shared bearer for backend's own
      # /internal/* endpoints (app/internal.py) — no LiteLLM service exists anymore.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      NO_PROXY: ${NO_PROXY}
      LDAP_ENABLED: ${LDAP_ENABLED}
      LDAP_URI: ${LDAP_URI}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_BIND_TEMPLATE: ${LDAP_BIND_TEMPLATE}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # v2 — persistent workspace orchestration (TECH-V2 §2/§6)
      WORKSPACE_IMAGE: ${WORKSPACE_IMAGE:-eco-ide-spike-code-server:latest}
      WORKSPACE_NETWORK: ${WORKSPACE_NETWORK:-ecocode_sandbox_net}
      WORKSPACE_IDLE_MINUTES: ${WORKSPACE_IDLE_MINUTES:-30}
      WORKSPACE_MAX_RUNNING: ${WORKSPACE_MAX_RUNNING:-4}
      WORKSPACE_UPSTREAM_BASE_URL: ${WORKSPACE_UPSTREAM_BASE_URL:-}
      GITLAB_DEFAULT_HOST: ${GITLAB_DEFAULT_HOST:-git.ecobin.ir}
    volumes:
      - users_data:/data/users
      - teams_data:/data/teams
      - attachments_data:/data/attachments
      - claude_state:/home/app/.claude
      - ${CLAUDE_CREDS_DIR:-./data/claude-creds}:/host_claude:ro
      # v2 — the backend orchestrates workspace containers via the Docker socket
      # (TECH-V2 §6). Root-equivalent host access; a minimal spawner service is the
      # production hardening step. group_add below grants the app user socket access.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-984}"
    expose:
      - "8000"
    # on both nets so workspace containers (internal net) can reach the backend relay.
    networks: [ecocode_net, ecocode_sandbox_net]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mock-upstream:
    build:
      context: ./mock-upstream
      network: host
    expose:
      - "8080"
    networks: [ecocode_net]
    profiles: ["dev"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      network: host
    command: sh -c "rm -rf /static/* /static/.[!.]* 2>/dev/null; cp -r /usr/share/nginx/html/. /static/ && echo 'frontend static synced'"
    restart: "no"
    volumes:
      - frontend_static:/static
    networks: [ecocode_net]

  nginx:
    build: ./nginx
    ports:
      - "${NGINX_HTTP_PORT:-8085}:80"
      # اصلاحیهٔ ۶: code-server (real VS Code) served here (ide profile).
      - "${CODE_SERVER_PORT:-8090}:8090"
      # - "443:443"   # فعال کنید و ./certs را mount کنید — nginx/nginx.conf بخش TLS را هم از کامنت خارج کنید
    volumes:
      - frontend_static:/usr/share/nginx/html
      # - ./certs:/etc/nginx/certs:ro
    # ecocode_sandbox_net lets nginx reach the internal-only code-server container.
    networks: [ecocode_net, ecocode_sandbox_net]
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
