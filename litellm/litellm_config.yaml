model_list:
  - model_name: claude-opus
    litellm_params:
      model: ecocode-upstream/claude-opus
  - model_name: claude-sonnet
    litellm_params:
      model: ecocode-upstream/claude-sonnet
  - model_name: claude-haiku
    litellm_params:
      model: ecocode-upstream/claude-haiku

litellm_settings:
  custom_provider_map:
    - provider: "ecocode-upstream"
      custom_handler: ecocode_upstream_handler.adapter
  drop_params: true

router_settings:
  # هر گروه مدل فقط یک deployment (رله‌ی ecocode-upstream) دارد؛ cooldown چیزی برای
  # failover ندارد و فقط بعد از چند خطا، کد واقعی upstream (401/529/…) را با
  # «no deployments available» (429) می‌پوشاند.
  disable_cooldowns: true

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/LITELLM_DATABASE_URL"
