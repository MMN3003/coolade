# Minimal static-file server config for the frontend's own Docker image.
# This only serves the built SPA with client-side routing fallback; it does
# NOT proxy /api or /v1 — that reverse-proxy responsibility belongs to the
# root nginx/ service (Dev1's ownership, TECH.md §2).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
